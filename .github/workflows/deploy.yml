name: 'Deploy'

on:
  push:
    branches:
      - main
      - demo
  workflow_dispatch:

jobs:
  build-image:
    uses: ./.github/workflows/_docker-build-image.yml
    secrets: inherit
    with:
      app-name: sandbox
      tag-name: ${{ github.ref_name }}
      deploy-key: ${{ github.ref_name }}

